name: Regression checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.lock.txt
            requirements-dev.txt
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - name: Offline Python regression
        # Prepare public static tokenizer data before the suite blocks external traffic.
        run: |
          python -c "import tiktoken; tiktoken.get_encoding('o200k_base')"
          python -X utf8 -m pytest -q -ra
      - name: Install frontend dependencies
        run: npm ci --prefix frontend --registry=https://registry.npmjs.org
      - name: Frontend regression
        run: npm test --prefix frontend
      - name: TypeScript and Vite build
        run: npm run build --prefix frontend
  container-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and start the user distribution
        run: docker compose up --build --wait --wait-timeout 120
      - name: Real Chinese and English OCR through HTTP
        run: docker compose exec -T rolepilot python scripts/ocr_smoke.py
      - name: Restart with the existing data volume
        run: |
          docker compose down
          docker compose up --wait --wait-timeout 120
          docker compose exec -T rolepilot python scripts/ocr_smoke.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down
